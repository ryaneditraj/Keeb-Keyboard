name: Design check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Parse the board and fabrication files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check KiCad design files
        run: python3 scripts/check_design.py
